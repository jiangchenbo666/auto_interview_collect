name: Daily Interview Pipeline

on:
  workflow_dispatch:
  schedule:
    # 23:17 UTC is 07:17 in Asia/Shanghai.
    # GitHub scheduled workflows can be delayed, especially near the top
    # of the hour, so this runs earlier to land around the 08:00 study slot.
    - cron: "17 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      INTERVIEW_DB_PATH: data/interview.db
      OBSIDIAN_VAULT_PATH: data/obsidian
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'kimi' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-v4-pro
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      KIMI_BASE_URL: https://api.moonshot.cn/v1
      KIMI_MODEL: kimi-k2.6
      LLM_TIMEOUT_SECONDS: "120"
      LLM_MAX_TOKENS: "1400"
      PYTHONUNBUFFERED: "1"
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      OBSIDIAN_REPOSITORY: jiangchenbo666/Obsidian-Vault
      OBSIDIAN_PAT: ${{ secrets.OBSIDIAN_PAT }}
      STUDY_PAGE_URL: https://jiangchenbo666.github.io/auto_interview_collect/

    steps:
      - name: Checkout tool repository
        uses: actions/checkout@v4

      - name: Checkout Obsidian vault
        if: ${{ env.OBSIDIAN_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OBSIDIAN_REPOSITORY }}
          token: ${{ env.OBSIDIAN_PAT }}
          path: data/obsidian

      - name: Skip Obsidian vault checkout
        if: ${{ env.OBSIDIAN_PAT == '' }}
        run: echo "OBSIDIAN_PAT is empty; continuing without cloud Obsidian notes."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore interview database cache
        uses: actions/cache/restore@v4
        with:
          path: data/interview.db
          key: interview-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            interview-db-

      - name: Run tests
        run: python -m pytest

      - name: Report Obsidian vault status
        run: python -m src.main vault-status --limit 3

      - name: Build daily study page
        timeout-minutes: 35
        shell: bash
        run: |
          mkdir -p public
          echo "LLM_PROVIDER=${LLM_PROVIDER:-kimi}"
          echo "KIMI_MODEL=$KIMI_MODEL"
          echo "DEEPSEEK_MODEL=$DEEPSEEK_MODEL"
          case "${LLM_PROVIDER:-kimi}" in
            kimi|moonshot)
              if [ -n "$KIMI_API_KEY" ] || [ -n "$MOONSHOT_API_KEY" ]; then
                LLM_FLAG="--use-llm"
              else
                echo "KIMI_API_KEY/MOONSHOT_API_KEY is empty; falling back to local template answers."
                LLM_FLAG=""
              fi
              ;;
            deepseek)
              if [ -n "$DEEPSEEK_API_KEY" ]; then
                LLM_FLAG="--use-llm"
              else
                echo "DEEPSEEK_API_KEY is empty; falling back to local template answers."
                LLM_FLAG=""
              fi
              ;;
            *)
              echo "Unsupported LLM_PROVIDER=$LLM_PROVIDER; falling back to local template answers."
              LLM_FLAG=""
              ;;
          esac
          python -u -m src.main study $LLM_FLAG --no-open --limit 6 --process-limit 12 --low-inventory-threshold 30 --html-output public/index.html --today-output public/today.md --bank-output public/questions.md
          touch public/.nojekyll

      - name: Save interview database cache
        uses: actions/cache/save@v4
        with:
          path: data/interview.db
          key: interview-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Push DingTalk notification
        shell: bash
        run: |
          if [ -n "$DINGTALK_WEBHOOK_URL" ]; then
            python -m src.main push-dingtalk --markdown public/today.md --title "Daily Interview Review" --page-url "$STUDY_PAGE_URL"
          else
            echo "DINGTALK_WEBHOOK_URL is empty; skip DingTalk notification."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
