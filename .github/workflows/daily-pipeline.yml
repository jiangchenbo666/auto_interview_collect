name: Daily Interview Pipeline

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC is 08:00 in Asia/Shanghai.
    - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      INTERVIEW_DB_PATH: data/interview.db
      OBSIDIAN_VAULT_PATH: data/obsidian
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-v4-flash
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      OBSIDIAN_REPOSITORY: jiangchenbo666/Obsidian-Vault
      OBSIDIAN_PAT: ${{ secrets.OBSIDIAN_PAT }}

    steps:
      - name: Checkout tool repository
        uses: actions/checkout@v4

      - name: Checkout Obsidian vault
        if: ${{ env.OBSIDIAN_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OBSIDIAN_REPOSITORY }}
          token: ${{ env.OBSIDIAN_PAT }}
          path: data/obsidian

      - name: Skip Obsidian vault checkout
        if: ${{ env.OBSIDIAN_PAT == '' }}
        run: echo "OBSIDIAN_PAT is empty; continuing without cloud Obsidian notes."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore interview database cache
        uses: actions/cache@v4
        with:
          path: data/interview.db
          key: interview-db-${{ github.run_id }}
          restore-keys: |
            interview-db-

      - name: Run tests
        run: python -m pytest

      - name: Report Obsidian vault status
        run: python -m src.main vault-status --limit 3

      - name: Build daily study page
        shell: bash
        run: |
          mkdir -p public
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            LLM_FLAG="--use-llm"
          else
            echo "DEEPSEEK_API_KEY is empty; falling back to local template answers."
            LLM_FLAG=""
          fi
          python -m src.main study $LLM_FLAG --no-open --process-limit 10 --html-output public/index.html --today-output public/today.md --bank-output public/questions.md
          touch public/.nojekyll

      - name: Push DingTalk notification
        shell: bash
        run: |
          if [ -n "$DINGTALK_WEBHOOK_URL" ]; then
            python -m src.main push-dingtalk --markdown public/today.md --title "Daily Interview Review"
          else
            echo "DINGTALK_WEBHOOK_URL is empty; skip DingTalk notification."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
